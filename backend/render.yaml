services:
  # 1. Express Node.js Web Service
  - type: web
    name: fuzzylogic-student-predictor-api
    env: node
    region: singapore # or oregon, frankfurt, etc.
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: fuzzylogic-postgres-db
          property: connectionString

databases:
  # 2. Managed PostgreSQL Database
  - name: fuzzylogic-postgres-db
    databaseName: fuzzy_student_db
    user: postgres
    region: singapore
    plan: free
